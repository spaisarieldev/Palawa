<mat-toolbar class="site-header" [class.is-scrolled]="ui.scrolled()">
  <div class="container header-inner">
    <a href="#top" class="brand" aria-label="Palawa Surf &amp; SUP — Inicio" (click)="ui.showSection('top', $event)">
      <img
        class="brand-logo"
        src="img/logo-palawa.png"
        alt="Palawa Surf &amp; SUP"
        width="180"
        height="118"
      />
    </a>

    <p class="header-title">Palawa Surf &amp; SUP</p>

    <div class="header-actions">
      <span class="header-proof">★ 5,0 · 11 reseñas · La Barra</span>
      <button mat-flat-button class="header-cta" type="button" (click)="ui.showSection('profe', $event)">
        <span>La profe</span>
      </button>
    </div>
  </div>
</mat-toolbar>
